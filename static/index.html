<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Festival Planner</title>
  <!-- Generated by the Tailwind CLI from tailwind/input.css – do not edit by hand. -->
  <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  <main class="mx-auto max-w-3xl px-4 py-6 sm:px-6 sm:py-10">
    <header class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-2xl font-bold sm:text-3xl">Festivalprogramm</h1>
        <p id="now-hint" class="mt-1 text-sm text-gray-600"></p>
      </div>
      <div class="grid grid-cols-2 gap-3 sm:flex">
        <div class="flex flex-col gap-1">
          <label for="day-filter" class="text-sm font-medium text-gray-700">Tag</label>
          <select id="day-filter"
                  class="min-h-11 w-full rounded-lg border border-gray-300 bg-white px-3 text-base shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200 sm:w-44">
            <option value="">Alle Tage</option>
          </select>
        </div>
        <div class="flex flex-col gap-1">
          <label for="stage-filter" class="text-sm font-medium text-gray-700">Bühne</label>
          <select id="stage-filter"
                  class="min-h-11 w-full rounded-lg border border-gray-300 bg-white px-3 text-base shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200 sm:w-44">
            <option value="">Alle Bühnen</option>
          </select>
        </div>
      </div>
    </header>
    <!-- Personal schedule (US-10): all favorites, independent of the filters, rendered by app.js.
         Native <details> accordion, collapsed by default (no "open" attribute). -->
    <details id="favorites" class="group mb-6 rounded-lg bg-white shadow-sm" hidden>
      <!-- flex hides the native marker, so the chevron is drawn here and turns when open -->
      <summary class="flex min-h-11 cursor-pointer items-center gap-2 rounded-lg px-4 font-semibold text-gray-800 hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-indigo-500">
        <span aria-hidden="true" class="text-gray-500 transition-transform group-open:rotate-90">▸</span>
        Meine Favoriten <span id="favorites-count" class="font-normal text-gray-600"></span>
      </summary>
      <div class="px-4 pb-4">
        <p id="favorites-empty" class="text-sm text-gray-600" hidden>Noch keine Favoriten. Tippe im Programm auf ☆, um dir einen Act zu merken.</p>
        <ul id="favorites-list" class="max-h-60 space-y-2 overflow-y-auto text-sm"></ul>
      </div>
    </details>
    <p id="empty-hint" class="rounded-lg bg-white p-4 text-gray-600 shadow-sm" hidden>Es sind noch keine Programmpunkte vorhanden.</p>
    <!-- One section per festival day (heading + list), rendered by app.js -->
    <div id="program" class="space-y-6"></div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
